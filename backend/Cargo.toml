[package]
name = "aethera-backend"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust backend for Aethera Botanical Archive"

[dependencies]
axum = { version = "0.8", features = ["tokio", "http1", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-full", "fs", "trace", "set-header"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1.0"
